name: Build and Deploy Overwatch GEOINT

on:
  push:
    branches:
      - master

jobs:
  validate:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pytest
          pip install -r requirements.txt

      - name: Type Check with MyPy
        run: |
          pip install mypy
          mypy app.py --ignore-missing-imports || true

      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Security Scan with Bandit
        run: bandit -r . -x ./venv,./tests -ll

      - name: Run Tests
        run: pytest tests/

  build-and-deploy:
    name: Build & Deploy Container
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: overwatch-geoint
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/overwatch-geoint:latest
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: overwatch-geoint
          IMAGE_TAG: latest
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to AWS Lambda
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: overwatch-geoint
        run: |
          aws lambda update-function-code --function-name overwatch_geoint_pipeline --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          aws lambda wait function-updated --function-name overwatch_geoint_pipeline
          aws lambda update-function-configuration --function-name overwatch_geoint_pipeline --timeout 300 --memory-size 1024

      - name: Deploy Frontend to S3
        run: |
          # Dynamically inject API Gateway URL
          echo 'window.OVERWATCH_CONFIG = { TRIGGER_URL: "https://yyp1jlzcjf.execute-api.us-east-1.amazonaws.com/trigger-overwatch" };' > src/frontend/config.js
          
          aws s3 cp command-center.html s3://hossam-cloud-resume-e4b1b23e/command-center.html
          aws s3 sync src/frontend s3://hossam-cloud-resume-e4b1b23e/src/frontend
