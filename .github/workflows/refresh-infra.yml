name: Refresh infra cache (daily, all countries)

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger full refresh (Lambda fans out to 5 countries, rate-limit safe)
        env:
          TRIGGER: ${{ secrets.OVERWATCH_TRIGGER_URL }}
        run: |
          curl -s -X POST "$TRIGGER" -H 'Content-Type: application/json' \
            -d '{"action":"refresh_all_infra"}' --max-time 50 || true
          echo "refresh triggered (Lambda continues in background)"
